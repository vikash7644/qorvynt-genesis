name: Deploy QORVYNT Genesis to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate game entry point
        run: |
          test -s index.html
          grep -q "three.module.js" index.html
          grep -q "GENESIS" index.html
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run game smoke checks
        run: node scripts/smoke-check.mjs
      - name: Check out QORVYNT compiler
        uses: actions/checkout@v4
        with:
          repository: vikash7644/zenvora-lang
          path: qorvynt-lang
      - name: Compile and execute the character authoring source with QVM
        run: |
          cargo build --manifest-path qorvynt-lang/Cargo.toml --release
          qorvynt-lang/target/release/qorvynt --qvm-compile world/character_animation.qv /tmp/genesis-character.qvmb
          qorvynt-lang/target/release/qorvynt --qvm-run /tmp/genesis-character.qvmb
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
